<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>写真一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="main" hidden>
  <header class="album-head">
    <a class="back" href="index.html#photos">← トップに戻る</a>
    <h1 id="albumTitle"></h1>
    <p id="albumCount"></p>
  </header>
  <div class="album-grid" id="albumGrid"></div>
  <nav class="pager" id="pager" aria-label="ページ送り"></nav>
  <div class="alb" id="lb" hidden role="dialog" aria-label="写真ビューア">
    <div class="alb-top"><span id="lbCount"></span><button type="button" class="alb-x" id="lbClose" aria-label="閉じる">×</button></div>
    <div class="alb-stage" id="lbStage">
      <button type="button" class="alb-nav prev" id="lbPrev" aria-label="前の写真">‹</button>
      <img id="lbImg" alt="" draggable="false">
      <button type="button" class="alb-nav next" id="lbNext" aria-label="次の写真">›</button>
    </div>
    <div class="alb-bottom"><button type="button" class="btn" id="lbSave">写真に保存</button></div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</main>
<script src="config.js"></script>
<script src="photos.js"></script>
<script src="album.js"></script>
</body>
</html>
