<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dropbox 連携の設定(司さん用)</title>
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.8; color: #1e2b45; }
  input { width: 100%; padding: .6rem; font-size: 1rem; box-sizing: border-box; }
  button { padding: .7rem 1.2rem; font-size: 1rem; margin-top: .75rem; cursor: pointer; }
  code, pre { background: #eef0f5; padding: .15rem .4rem; word-break: break-all; }
  pre { padding: .8rem; white-space: pre-wrap; user-select: all; }
  .box { border: 1px solid #c9cce0; padding: 1rem; margin: 1rem 0; }
</style>
</head>
<body>
<h1>Dropbox 連携の設定</h1>
<p>司さん専用のページです。ゲストが開く必要はありません。設定が終わったら、このファイルは消して大丈夫です。</p>
<div class="box" id="step1">
  <p><b>1. Dropboxアプリの「App key」を貼ります</b></p>
  <input id="key" placeholder="App key(英数字の文字列)" autocomplete="off">
  <p>Dropboxのアプリ設定の「Redirect URIs」に、次のURLを登録してあることを確認してください。</p>
  <pre id="redir"></pre>
  <button id="go">2. Dropboxで許可する</button>
</div>
<div class="box" id="result" hidden>
  <p><b>できました!</b> 下の4行を、<code>config.js</code> の <code>dropbox: { … }</code> の中身と置き換えてください。</p>
  <pre id="out"></pre>
  <p>※ <code>refreshToken</code> は大切な鍵です。他の人に送らないでください。</p>
</div>
<p id="msg"></p>
<script>
const $ = (id) => document.getElementById(id);
const redirect = location.origin + location.pathname;
$("redir").textContent = redirect;
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
$("key").value = localStorage.getItem("dbx-key") || "6gozh2jso3gp47q";
$("go").onclick = async () => {
  const key = $("key").value.trim();
  if (!key) { $("msg").textContent = "App key を入力してください。"; return; }
  localStorage.setItem("dbx-key", key);
  const ver = b64(crypto.getRandomValues(new Uint8Array(48)));
  sessionStorage.setItem("dbx-ver", ver);
  const ch = b64(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(ver)));
  location.href = "https://www.dropbox.com/oauth2/authorize?" + new URLSearchParams({
    client_id: key, response_type: "code", token_access_type: "offline",
    code_challenge: ch, code_challenge_method: "S256", redirect_uri: redirect });
};
(async () => {
  const code = new URLSearchParams(location.search).get("code");
  if (!code) return;
  $("step1").hidden = true; $("msg").textContent = "確認中…";
  try {
    const r = await fetch("https://api.dropboxapi.com/oauth2/token", { method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ grant_type: "authorization_code", code, client_id: localStorage.getItem("dbx-key"),
        redirect_uri: redirect, code_verifier: sessionStorage.getItem("dbx-ver") }) });
    const j = await r.json();
    if (!j.refresh_token) throw new Error(JSON.stringify(j));
    $("out").textContent = `dropbox: {\n  appKey: "${localStorage.getItem("dbx-key")}",\n  refreshToken: "${j.refresh_token}",\n  folder: "/guests"\n},`;
    $("result").hidden = false; $("msg").textContent = "";
    history.replaceState(null, "", location.pathname);
  } catch (e) { $("msg").textContent = "うまくいきませんでした: " + e.message; $("step1").hidden = false; }
})();
</script>
</body>
</html>
