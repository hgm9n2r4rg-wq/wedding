<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>結婚式のご案内</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body >
<div class="gate" id="gate">
  <h1 id="gateTitle"></h1>
  <p>ご案内ページを開くには合言葉を入力してください</p>
  <form id="gateForm">
    <input id="pw" type="password" autocomplete="off" aria-label="合言葉" placeholder="合言葉">
    <button type="submit">ひらく</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<main id="main" hidden>
  <header class="hero">
    <div class="hero-slides" id="heroSlides" aria-hidden="true"></div>
    <h1 class="names" id="names"></h1>
    <p class="hero-date" id="heroDate"></p>
    <p class="hero-lead">私たちの結婚式にお越しください</p>
    <a class="btn" href="info.html">ご案内を見る</a>
  </header>
  <footer id="footer"></footer>
</main>

<script src="config.js"></script>
<script src="site.js"></script>
</body>
</html>
