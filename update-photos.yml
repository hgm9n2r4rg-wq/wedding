name: 写真の一覧を更新

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "config.js"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 写真の一覧を作る
        run: python3 .github/scripts/make_photos.py
      - name: 変わっていたら保存する
        run: |
          if [ -n "$(git status --porcelain photos.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add photos.js
            git commit -m "写真の一覧を更新"
            git push
          fi
