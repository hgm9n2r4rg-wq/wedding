<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>結婚式のご案内</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="gate" id="gate">
  <h1 id="gateTitle"></h1>
  <p>ご案内ページを開くには合言葉を入力してください</p>
  <form id="gateForm">
    <input id="pw" type="password" autocomplete="off" aria-label="合言葉" placeholder="合言葉">
    <button type="submit">ひらく</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<main id="main" hidden>
  <header class="hero" id="top">
    <div class="hero-slides" id="heroSlides" aria-hidden="true"></div>
    <h1 class="names" id="names"></h1>
    <p class="hero-date" id="heroDate"></p>
    <p class="hero-lead">私たちの結婚式にお越しください</p>
    <a class="btn" href="#info">ご案内を見る</a>
  </header>

  <section id="info">
    <h2>日時・アクセス</h2>
    <dl id="infoList"></dl>
    <a class="btn" id="mapLink" target="_blank" rel="noopener">Googleマップで開く</a>
    <ul class="access" id="access"></ul>
  </section>

  <div class="strip-wrap"><div class="strip" id="strip"></div></div>

  <section id="schedule">
    <h2>当日の流れ</h2>
    <ol class="timeline" id="timeline"></ol>
  </section>

  <section id="about">
    <h2>二人の生い立ち</h2>
    <div class="profiles" id="profiles"></div>
    <h3 class="sub">これまでのあゆみ</h3>
    <p class="hint">横にスライドして見られます →</p>
    <ol class="htl" id="history"></ol>
  </section>

  <section id="photos">
    <h2>ギャラリー</h2>
    <div id="gallery"></div>
  </section>

  <section id="share" class="share">
    <h2>当日の写真</h2>
    <p>当日に撮った写真は、ここから送っていただけます。みなさまの写真もあとで見られます。</p>
    <div id="shareLinks"></div>
  </section>

  <footer id="footer"></footer>
</main>

<script src="config.js"></script>
<script src="site.js"></script>
</body>
</html>
